<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dispensary Directory | The Green Border</title>

  <!-- ═══════════════════════════════════════════════════════════════
       This page used to be a second dispensary directory, running its
       own renderer over the same data the homepage renders. The two
       have been merged: the homepage directory is now the only one, and
       everything this page could do lives there.

       The URL is kept rather than deleted because it has been in the
       sitemap at priority 0.9 and is the target of external links.
       GitHub Pages cannot issue a 301, so this is the closest thing
       available: a canonical pointing home, a meta refresh for clients
       without JS, and a script that forwards the filter params.
       ═══════════════════════════════════════════════════════════════ -->

  <link rel="canonical" href="https://greenborder.org/#dispensaries" />
  <meta name="robots" content="noindex, follow" />
  <meta http-equiv="refresh" content="0; url=/#dispensaries" />

  <link rel="stylesheet" href="/css/brand.css?v=49849bb7" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #fffdf0 0%, #f7f3e2 100%);
      color: var(--gb-ink-500, #4b5233);
      font-family: 'Inter', system-ui, sans-serif;
      text-align: center;
      padding: 24px;
    }
    a { color: var(--gb-green-700, #375302); font-weight: 600; }
  </style>
</head>
<body>
  <p>
    The dispensary directory now lives on the home page.<br />
    <a href="/#dispensaries">Continue to the directory →</a>
  </p>

  <script>
    // Carry the old filter params across. /directory.html used ?q= and
    // ?city=; the homepage reads ?find= and ?city=, and accepts ?q= as
    // an alias. replace() rather than assign() so Back doesn't bounce
    // the visitor straight back here.
    (function () {
      var from = new URLSearchParams(location.search);
      var to = new URLSearchParams();
      var q = from.get('q') || from.get('find');
      if (q) to.set('find', q);
      if (from.get('city')) to.set('city', from.get('city'));
      var qs = to.toString();
      location.replace('/' + (qs ? '?' + qs : '') + '#dispensaries');
    })();
  </script>
</body>
</html>
