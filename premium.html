<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium - Exclusive El Paso Dispensary Sales Data</title>
</head>
<body>
    <div id="protected-content" style="display: none;">
        <h1>Exclusive El Paso Dispensary Sales Data</h1>
        <div id="user-button"></div>
    </div>

    <div id="sign-in-container" style="display: none;"></div>

    <script async crossorigin="anonymous" data-clerk-publishable-key="pk_test_aW5zcGlyZWQtc2Vhc25haWwtNDUuY2xlcmsuYWNjb3VudHMuZGV2JA" src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js" type="text/javascript"></script>

    <script>
        window.addEventListener("load", async () => {
            await window.Clerk.load();

            if (window.Clerk.user) {
                // User is logged in
                document.getElementById("protected-content").style.display = "block";
                document.getElementById("sign-in-container").style.display = "none";

                // Mount user button
                window.Clerk.mountUserButton(document.getElementById("user-button"));
            } else {
                // User is not logged in
                document.getElementById("protected-content").style.display = "none";
                document.getElementById("sign-in-container").style.display = "block";

                // Mount sign-in component
                window.Clerk.mountSignIn(document.getElementById("sign-in-container"));
            }
        });
    </script>
</body>
</html>
